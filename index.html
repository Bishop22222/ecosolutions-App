<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FIXED CSP (allows Chart.js to load) -->
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
      script-src * 'unsafe-inline' 'unsafe-eval';
      connect-src *;
      style-src * 'unsafe-inline';
      img-src * data: blob:;
      font-src *;
    "
  >

  <title>EcoSolutions App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="app-header">
  <h1 id="screen-title">Login</h1>

  <button class="theme-toggle"
    onclick="if(window.toggleTheme) window.toggleTheme()">
    Toggle Theme
  </button>
</header>

<!-- ================= LOGIN ================= -->
<section id="login" class="active">
  <h2>Welcome to EcoSolutions</h2>

  <div class="login-form">
    <input type="text" id="username" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <button class="btn" onclick="window.handleLogin()">
      Login
    </button>
  </div>

  <div id="login-feedback"></div>
</section>

<!-- ================= REGISTER ================= -->
<section id="register">
  <h2>Create Account</h2>

  <div class="login-form">
    <input type="text" id="reg-email" placeholder="Email">
    <input type="text" id="reg-username" placeholder="Username">
    <input type="password" id="reg-password" placeholder="Password">

    <button class="btn" onclick="window.handleRegister()">
      Register
    </button>
  </div>

  <div id="register-feedback"></div>
</section>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard">
  <h2>Dashboard</h2>

  <p>Available Balance: <strong id="points">0</strong> pts</p>

  <div class="chart-box">
    <h3>Monthly Recycling Performance (kg)</h3>

    <!-- IMPORTANT: Canvas -->
    <canvas id="performanceChart"></canvas>

  </div>
</section>

<!-- ================= NAV ================= -->
<nav class="bottom-nav" id="main-nav" style="display:none;">
  <button onclick="window.navigate('dashboard')">Home</button>
  <button onclick="window.navigate('scan')">Scan</button>
  <button onclick="window.navigate('rewards')">Rewards</button>
  <button onclick="window.navigate('leaderboard')">Leaders</button>
  <button onclick="window.navigate('profile')">Profile</button>
</nav>

<!-- SCRIPTS (ORDER MATTERS) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="charts.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
