<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSolutions App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1 id="screen-title">Login</h1>
  <button onclick="toggleTheme()">Theme</button>
</header>

<!-- LOGIN -->
<section id="login" class="active">
  <h2>Login</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button class="btn" onclick="handleLogin()">Login</button>

  <p onclick="navigate('register')" style="cursor:pointer;color:green;">
    Create account
  </p>

  <div id="login-feedback"></div>
</section>

<!-- REGISTER -->
<section id="register">
  <h2>Register</h2>

  <input type="email" id="reg-email" placeholder="Email">
  <input type="text" id="reg-username" placeholder="Username">
  <input type="password" id="reg-password" placeholder="Password">

  <button class="btn" onclick="handleRegister()">Register Account</button>

  <p onclick="navigate('login')" style="cursor:pointer;color:green;">
    Back to login
  </p>

  <div id="register-feedback"></div>
</section>

<!-- DASHBOARD -->
<section id="dashboard">
  <h2>Dashboard</h2>
  <p>Points: <span id="points">0</span></p>
</section>

<!-- PROFILE -->
<section id="profile">
  <h2>Profile</h2>

  <h3 id="profile-name-display">Loading...</h3>
  <p>Points: <span class="profile-points-sync">0</span></p>

  <button onclick="handleLogout()">Logout</button>
</section>

<!-- NAV -->
<nav id="main-nav" style="display:none;">
  <button onclick="navigate('dashboard')">Home</button>
  <button onclick="navigate('profile')">Profile</button>
</nav>

<script type="module" src="app.js"></script>

</body>
</html>
